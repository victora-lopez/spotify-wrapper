[project]
name = "spotify-wrapped"
version = "0.1.0"
description = "Spotify wrapper package that connects to spotify's webapi"
readme = "README.md"
authors = [
    { name = "victor lopez", email = "victorandreslopez314@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1,<0.29.0",
    "pydantic>=2.14.3,<3.0.0",
]

[project.scripts]
spotify-wrapper = "spotify_wrapper:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
